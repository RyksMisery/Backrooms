<svg viewBox="0 0 780 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
<title>Реальный хаб 4×4 и спираль вокруг него</title>
<desc>Хаб — 2×2 колонных зала (1.1–2.2), 8 разветвителей по краям (16 торцов) и 4 угловых зала, которые работают узлами-поворотами кольца. Спираль стандартных областей наматывается вокруг блока, докуясь к торцам.</desc>
<defs>
<marker id="am" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#E3B34A"/></marker>
<marker id="pmk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9A78D0"/></marker>
</defs>

<rect x="0" y="0" width="780" height="780" fill="#16150E"/>
<rect x="12" y="42" width="756" height="686" rx="14" fill="#16150E" stroke="#35301F"/>
<text x="24" y="30" fill="#ECE6D6" font-size="18" font-weight="700">Реальный хаб: 4 зала (2×2) + 8 разветвителей (16 торцов) + 4 угловых зала (узлы кольца)</text>

<!-- amber spiral ring around the whole block -->
<rect x="120" y="150" width="480" height="480" rx="46" fill="none" stroke="#E3B34A" stroke-width="4"/>
<g fill="#E3B34A">
<path d="M354,144 l16,6 l-16,6 Z"/>
<path d="M606,384 l-6,16 l-6,-16 Z"/>
<path d="M366,636 l-16,-6 l16,-6 Z"/>
<path d="M114,396 l6,-16 l6,16 Z"/>
</g>
<!-- ring links THROUGH the corner halls (corner halls = turn nodes) -->
<g stroke="#E3B34A" stroke-width="3" stroke-dasharray="2 3">
<line x1="150" y1="182" x2="188" y2="218"/>
<line x1="570" y1="182" x2="532" y2="218"/>
<line x1="570" y1="598" x2="532" y2="562"/>
<line x1="150" y1="598" x2="188" y2="562"/>
</g>

<!-- corner halls = ring turn-nodes (amber) -->
<g>
<rect x="170" y="200" width="80" height="80" rx="7" fill="#2a2510" stroke="#E3B34A" stroke-width="2.2"/><text x="210" y="234" fill="#E9D9A6" font-size="9" text-anchor="middle">зал·угол</text><text x="210" y="247" fill="#E3B34A" font-size="8.5" text-anchor="middle">кольца</text><text x="210" y="260" fill="#8A8370" font-size="9" text-anchor="middle">0.0</text>
<rect x="470" y="200" width="80" height="80" rx="7" fill="#2a2510" stroke="#E3B34A" stroke-width="2.2"/><text x="510" y="234" fill="#E9D9A6" font-size="9" text-anchor="middle">зал·угол</text><text x="510" y="247" fill="#E3B34A" font-size="8.5" text-anchor="middle">кольца</text><text x="510" y="260" fill="#8A8370" font-size="9" text-anchor="middle">3.0</text>
<rect x="170" y="500" width="80" height="80" rx="7" fill="#2a2510" stroke="#E3B34A" stroke-width="2.2"/><text x="210" y="534" fill="#E9D9A6" font-size="9" text-anchor="middle">зал·угол</text><text x="210" y="547" fill="#E3B34A" font-size="8.5" text-anchor="middle">кольца</text><text x="210" y="560" fill="#8A8370" font-size="9" text-anchor="middle">0.3</text>
<rect x="470" y="500" width="80" height="80" rx="7" fill="#2a2510" stroke="#E3B34A" stroke-width="2.2"/><text x="510" y="534" fill="#E9D9A6" font-size="9" text-anchor="middle">зал·угол</text><text x="510" y="547" fill="#E3B34A" font-size="8.5" text-anchor="middle">кольца</text><text x="510" y="560" fill="#8A8370" font-size="9" text-anchor="middle">3.3</text>
</g>
<!-- branches (8) -->
<g>
<rect x="270" y="200" width="80" height="80" rx="7" fill="#23201a" stroke="#9AA6B2" stroke-width="1.6"/><text x="310" y="235" fill="#B7C0CA" font-size="9" text-anchor="middle">разветв.</text><text x="310" y="249" fill="#8A8370" font-size="9" text-anchor="middle">1.0</text>
<rect x="370" y="200" width="80" height="80" rx="7" fill="#241f14" stroke="#4FB56E" stroke-width="2"/><text x="410" y="235" fill="#B7C0CA" font-size="9" text-anchor="middle">разветв.</text><text x="410" y="249" fill="#A9E3BE" font-size="9" text-anchor="middle">2.0 вход</text>
<rect x="170" y="300" width="80" height="80" rx="7" fill="#23201a" stroke="#9AA6B2" stroke-width="1.6"/><text x="210" y="335" fill="#B7C0CA" font-size="9" text-anchor="middle">разветв.</text><text x="210" y="349" fill="#8A8370" font-size="9" text-anchor="middle">0.1</text>
<rect x="170" y="400" width="80" height="80" rx="7" fill="#241f26" stroke="#9A78D0" stroke-width="1.8"/><text x="210" y="435" fill="#C9B7EC" font-size="9" text-anchor="middle">разветв.</text><text x="210" y="449" fill="#8A8370" font-size="9" text-anchor="middle">0.2</text>
<rect x="470" y="300" width="80" height="80" rx="7" fill="#1c2530" stroke="#57C6D8" stroke-width="1.8"/><text x="510" y="335" fill="#B7C0CA" font-size="9" text-anchor="middle">разветв.</text><text x="510" y="349" fill="#8A8370" font-size="9" text-anchor="middle">3.1</text>
<rect x="470" y="400" width="80" height="80" rx="7" fill="#23201a" stroke="#9AA6B2" stroke-width="1.6"/><text x="510" y="435" fill="#B7C0CA" font-size="9" text-anchor="middle">разветв.</text><text x="510" y="449" fill="#8A8370" font-size="9" text-anchor="middle">3.2</text>
<rect x="270" y="500" width="80" height="80" rx="7" fill="#23201a" stroke="#9AA6B2" stroke-width="1.6"/><text x="310" y="535" fill="#B7C0CA" font-size="9" text-anchor="middle">разветв.</text><text x="310" y="549" fill="#8A8370" font-size="9" text-anchor="middle">1.3</text>
<rect x="370" y="500" width="80" height="80" rx="7" fill="#241f14" stroke="#4FB56E" stroke-width="2"/><text x="410" y="535" fill="#B7C0CA" font-size="9" text-anchor="middle">разветв.</text><text x="410" y="549" fill="#A9E3BE" font-size="9" text-anchor="middle">2.3 возв.</text>
</g>
<!-- merged column hall 2x2 -->
<rect x="270" y="300" width="180" height="180" rx="8" fill="#211d14" stroke="#E3B34A" stroke-width="2.5"/>
<g fill="#4a4326"><rect x="300" y="330" width="10" height="10"/><rect x="355" y="330" width="10" height="10"/><rect x="410" y="330" width="10" height="10"/><rect x="300" y="385" width="10" height="10"/><rect x="410" y="385" width="10" height="10"/><rect x="300" y="440" width="10" height="10"/><rect x="355" y="440" width="10" height="10"/><rect x="410" y="440" width="10" height="10"/></g>
<text x="360" y="384" fill="#ECE6D6" font-size="12" font-weight="700" text-anchor="middle">КОЛОННЫЙ ЗАЛ</text>
<text x="360" y="400" fill="#D8C89A" font-size="9" text-anchor="middle">1.1 · 2.1 · 1.2 · 2.2 (4 области)</text>
<path d="M360,410 l4,8 l9,1 l-6,6 l1,9 l-8,-4 l-8,4 l1,-9 l-6,-6 l9,-1 Z" fill="#4FB56E"/>
<text x="360" y="452" fill="#4FB56E" font-size="8.5" text-anchor="middle">выход: ноклип после возврата</text>

<!-- 16 outlet ticks -->
<g stroke="#6b6446" stroke-width="3" stroke-linecap="round">
<line x1="296" y1="200" x2="296" y2="184"/><line x1="324" y1="200" x2="324" y2="184"/>
<line x1="396" y1="200" x2="396" y2="184"/><line x1="424" y1="200" x2="424" y2="184"/>
<line x1="296" y1="580" x2="296" y2="596"/><line x1="324" y1="580" x2="324" y2="596"/>
<line x1="396" y1="580" x2="396" y2="596"/><line x1="424" y1="580" x2="424" y2="596"/>
<line x1="170" y1="326" x2="154" y2="326"/><line x1="170" y1="354" x2="154" y2="354"/>
<line x1="170" y1="426" x2="154" y2="426"/><line x1="170" y1="454" x2="154" y2="454"/>
<line x1="550" y1="326" x2="566" y2="326"/><line x1="550" y1="354" x2="566" y2="354"/>
<line x1="550" y1="426" x2="566" y2="426"/><line x1="550" y1="454" x2="566" y2="454"/>
</g>

<!-- entrance / return connectors -->
<line x1="410" y1="200" x2="410" y2="176" stroke="#E3B34A" stroke-width="4" marker-end="url(#am)"/>
<line x1="410" y1="604" x2="410" y2="580" stroke="#E3B34A" stroke-width="4" marker-end="url(#am)"/>

<!-- docked spiral areas (samples on the ring) -->
<g>
<rect x="372" y="120" width="76" height="52" rx="8" fill="#23201a" stroke="#4FB56E" stroke-width="2.5"/><text x="410" y="142" fill="#ECE6D6" font-size="10" font-weight="700" text-anchor="middle">ВХОД</text><text x="410" y="158" fill="#A9E3BE" font-size="8.5" text-anchor="middle">спираль · 2.-1</text>
<rect x="562" y="248" width="76" height="52" rx="8" fill="#23201a" stroke="#E3B34A" stroke-width="2"/><text x="600" y="270" fill="#D8C89A" font-size="10" font-weight="700" text-anchor="middle">область</text><text x="600" y="286" fill="#8A8370" font-size="8.5" text-anchor="middle">4.0</text>
<rect x="562" y="480" width="76" height="52" rx="8" fill="#23201a" stroke="#E3B34A" stroke-width="2"/><text x="600" y="502" fill="#D8C89A" font-size="10" font-weight="700" text-anchor="middle">область</text><text x="600" y="518" fill="#8A8370" font-size="8.5" text-anchor="middle">4.3</text>
<rect x="372" y="608" width="76" height="52" rx="8" fill="#23201a" stroke="#E3B34A" stroke-width="2"/><text x="410" y="630" fill="#D8C89A" font-size="10" font-weight="700" text-anchor="middle">ВОЗВРАТ</text><text x="410" y="646" fill="#8A8370" font-size="8.5" text-anchor="middle">2.4 → в зал</text>
<rect x="82" y="368" width="76" height="52" rx="8" fill="#23201a" stroke="#E3B34A" stroke-width="2"/><text x="120" y="390" fill="#D8C89A" font-size="10" font-weight="700" text-anchor="middle">область</text><text x="120" y="406" fill="#8A8370" font-size="8.5" text-anchor="middle">-1.2</text>
<rect x="672" y="338" width="76" height="52" rx="8" fill="#201c2a" stroke="#C98BFF" stroke-width="2"/><text x="710" y="360" fill="#C9B7EC" font-size="10" font-weight="700" text-anchor="middle">обход</text><text x="710" y="376" fill="#9A78D0" font-size="8.5" text-anchor="middle">5.1</text>
</g>
<line x1="600" y1="300" x2="600" y2="480" stroke="#D9584A" stroke-width="2.5" stroke-dasharray="5 5"/>
<text x="600" y="394" fill="#D9584A" font-size="12" font-weight="700" text-anchor="middle">✕</text>
<path d="M626,290 C690,300 690,330 710,338" fill="none" stroke="#C98BFF" stroke-width="2.5" stroke-dasharray="3 4"/>
<path d="M710,390 C690,430 660,470 626,486" fill="none" stroke="#C98BFF" stroke-width="2.5" stroke-dasharray="3 4"/>

<text x="516" y="316" fill="#57C6D8" font-size="9">окно→</text>
<line x1="164" y1="440" x2="128" y2="440" stroke="#9A78D0" stroke-width="3"/>
<circle cx="118" cy="440" r="8" fill="#9A78D0" opacity="0.25" stroke="#9A78D0"/><text x="118" y="444" fill="#9A78D0" font-size="10" text-anchor="middle">↺</text>
<text x="150" y="424" fill="#9A78D0" font-size="9">тупик</text>

<g font-size="11" fill="#C9C2AC">
<line x1="24" y1="700" x2="50" y2="700" stroke="#E3B34A" stroke-width="4" marker-end="url(#am)"/><text x="58" y="704">спираль по кольцу; углы блока = повороты кольца</text>
<rect x="360" y="694" width="12" height="12" rx="3" fill="none" stroke="#9AA6B2" stroke-width="2"/><text x="378" y="704">8 разветвителей = 16 торцов</text>
<rect x="600" y="694" width="12" height="12" rx="3" fill="none" stroke="#C98BFF" stroke-width="2"/><text x="618" y="704">обход снаружи</text>
</g>
<text x="24" y="722" fill="#8A8370" font-size="10">Торцы (16): 1 — вход, часть — тупики/окна, южный — возврат в зал (там выход). Угловые залы включены в маршрут, не пустуют.</text>
</svg>
